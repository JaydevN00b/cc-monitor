<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23FF4D1A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#F4F4F4;--fg2:#C8C8C8;--mute:#8A8A8A;--done:#6A6A6A;--dim:#1D1D1D;--line:#333;--chip:#3A3A3A;--accent:#FF4D1A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;overflow-x:hidden}
.grot{font-family:'Space Grotesk','Segoe UI',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;font-variant-ligatures:none}
.num{font-variant-numeric:tabular-nums}
.lbl{font-family:'JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;font-size:10.5px;font-weight:500;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.w{color:var(--fg)} .m{color:var(--mute)} .a{color:var(--accent)} .b{font-weight:700}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
.breathe{animation:breathe 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.breathe{animation:none}}
#panel{max-width:520px;margin:0 auto;padding:18px 32px 24px;display:flex;flex-direction:column}
.sep{border-top:1px dotted var(--line);margin:20px 0 0;padding-top:20px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.chip{font-family:'JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:3px;border:1px solid var(--chip);color:var(--fg2);text-transform:uppercase;white-space:nowrap}
.chip.fill{padding:3px 7px;border:0;background:var(--accent);color:#000}
.chip.ghost{color:var(--mute)}
svg{display:block}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tab{font-family:'JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:3px;border:1px solid #262626;background:transparent;color:var(--mute);cursor:pointer;max-width:150px}
.tab:hover{color:var(--fg);border-color:var(--chip)}
.tab.on{color:var(--fg);border-color:var(--fg2)}
.empty{margin-top:40px;line-height:1.7;font-size:12px}
code{font-family:'JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;color:var(--fg);background:#111;padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<main id="panel" aria-label="cc-monitor live panel" aria-live="off">
  <div id="s-header"></div>
  <div id="s-five"></div>
  <div id="s-week"></div>
  <div id="s-ctx"></div>
  <div id="s-models"></div>
  <div id="s-agents"></div>
  <div id="s-changes"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
